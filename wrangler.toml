# Cloudflare Workers Static Assets + canonical-host redirect worker.
# Name must match the Workers Builds project: bwax-me-v1
name = "bwax-me-v1"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
nodejs_compat = true
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the worker first so www / http / /index.html 301 before assets are served.
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 0.1

# Enable compression
[compression]
brotli = true
gzip = true
